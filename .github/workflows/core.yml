name: Build C++ core

# core/ 是跨平台立体匹配库：Windows (MSVC) / Linux (gcc) / macOS (clang) 三平台编译，
# 并跑与 numpy 孪生实现（tools/sgm_ref.py）的逐位对拍。
#
# 对拍用的是**仓库里提交的** core/tests/golden/（tiny，0.28 MB），所以这个 job
# 不需要 Python、也不需要网络依赖，结果完全确定。要重新生成向量见 core/README.md。

on:
  push:
    branches: [main, test]
    paths:
      - "core/**"
      - "apps/**"
      - "CMakeLists.txt"
      - "tools/check_api_surface.py"
      - "scripts/check_layering.sh"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "core/**"
      - "apps/**"
      - "CMakeLists.txt"
      - "tools/check_api_surface.py"
      - "scripts/check_layering.sh"
      - ".github/workflows/core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # 契约与边界检查：C API 表面快照 + 目录/依赖红线。
      # 放在编译之前：违反约定的提交连编译机会都没有，日志里直接看到哪一行。
      - name: Contract checks (C API surface + layering)
        shell: bash
        run: |
          set -euo pipefail
          # Windows runner 上 `python3` 可能是应用商店占位符，所以用“能真正执行”来选。
          PY=""
          for c in python3 python; do
            if "$c" -c "import sys" >/dev/null 2>&1; then PY="$c"; break; fi
          done
          [ -n "$PY" ] || { echo "找不到可用的 python"; exit 1; }
          echo "python: $PY ($("$PY" -V 2>&1))"
          "$PY" tools/check_api_surface.py
          bash scripts/check_layering.sh

      - name: Configure
        run: cmake -S core -B build/core -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/core --config Release --parallel

      - name: Golden test (bit-exact vs numpy twin)
        shell: bash
        run: |
          set -euo pipefail
          BIN=""
          for c in build/core/golden_test \
                   build/core/Release/golden_test.exe \
                   build/core/Debug/golden_test.exe; do
            if [ -f "$c" ]; then BIN="$c"; break; fi
          done
          if [ -z "$BIN" ]; then
            echo "找不到 golden_test，产物目录："
            find build/core -maxdepth 3 -type f \( -name "*golden*" -o -name "*.exe" \) | head -20
            exit 1
          fi
          echo "== $BIN =="
          "$BIN" core/tests/golden

      - name: Geometry test (极线矫正 / 重采样 / 深度回转)
        shell: bash
        run: |
          set -euo pipefail
          BIN=""
          for c in build/core/geometry_test \
                   build/core/Release/geometry_test.exe \
                   build/core/Debug/geometry_test.exe; do
            if [ -f "$c" ]; then BIN="$c"; break; fi
          done
          if [ -z "$BIN" ]; then
            echo "找不到 geometry_test，产物目录："
            find build/core -maxdepth 3 -type f -name "*geometry*" | head -20
            exit 1
          fi
          echo "== $BIN =="
          "$BIN"

      - name: C API smoke test (纯 C 编译器)
        shell: bash
        run: |
          set -euo pipefail
          BIN=""
          for c in build/core/c_api_smoke \
                   build/core/Release/c_api_smoke.exe \
                   build/core/Debug/c_api_smoke.exe; do
            if [ -f "$c" ]; then BIN="$c"; break; fi
          done
          if [ -z "$BIN" ]; then
            echo "找不到 c_api_smoke"
            find build/core -maxdepth 3 -type f -name "*c_api*" | head -20
            exit 1
          fi
          echo "== $BIN =="
          "$BIN"

      - name: Analyze test (深度连通域 / 分位数采样)
        shell: bash
        run: |
          set -euo pipefail
          BIN=""
          for c in build/core/analyze_test \
                   build/core/Release/analyze_test.exe \
                   build/core/Debug/analyze_test.exe; do
            if [ -f "$c" ]; then BIN="$c"; break; fi
          done
          if [ -z "$BIN" ]; then
            echo "找不到 analyze_test"
            find build/core -maxdepth 3 -type f -name "*analyze*" | head -20
            exit 1
          fi
          echo "== $BIN =="
          "$BIN"

      - name: Calibrate test (自动标定搜索)
        shell: bash
        run: |
          set -euo pipefail
          BIN=""
          for c in build/core/calibrate_test                    build/core/Release/calibrate_test.exe                    build/core/Debug/calibrate_test.exe; do
            if [ -f "$c" ]; then BIN="$c"; break; fi
          done
          if [ -z "$BIN" ]; then
            echo "找不到 calibrate_test"
            find build/core -maxdepth 3 -type f -name "*calibrate*" | head -20
            exit 1
          fi
          echo "== $BIN =="
          "$BIN"

      - name: Frame test (第 2..5 步 CPU 全流水线 / 参数表)
        shell: bash
        run: |
          set -euo pipefail
          BIN=""
          for c in build/core/frame_test                    build/core/Release/frame_test.exe                    build/core/Debug/frame_test.exe; do
            if [ -f "$c" ]; then BIN="$c"; break; fi
          done
          if [ -z "$BIN" ]; then
            echo "找不到 frame_test"
            find build/core -maxdepth 3 -type f -name "*frame*" | head -20
            exit 1
          fi
          echo "== $BIN =="
          "$BIN"

      # ------------------------------------------------------------------
      # 第二个前端：apps/cli（只 include 公开 C 头，零第三方依赖）
      # 它同时是"公开 C 面是否够用"的验收件：编不过或跑不通，就说明 API 缺口。
      # ------------------------------------------------------------------
      - name: CLI build (second frontend)
        run: |
          cmake -S . -B build/all -DCMAKE_BUILD_TYPE=Release
          cmake --build build/all --config Release --parallel --target stereo_cli

      - name: CLI smoke (fixtures + determinism)
        shell: bash
        run: |
          set -euo pipefail
          BIN=""
          for c in build/all/apps/cli/Release/stereo_cli.exe build/all/apps/cli/stereo_cli; do
            if [ -f "$c" ]; then BIN="$c"; break; fi
          done
          if [ -z "$BIN" ]; then
            echo "找不到 stereo_cli"
            find build/all -name "*stereo_cli*" | head -20
            exit 1
          fi
          mkdir -p build/cli-out
          ARGS=(--left apps/cli/testdata/left.pgm
                --right apps/cli/testdata/right.pgm
                --calib apps/cli/testdata/calib.txt
                --depth build/cli-out/depth.pfm
                --disp build/cli-out/disp.pfm
                --labels build/cli-out/labels.pgm
                --ply build/cli-out/cloud.ply)
          REPORT=$("$BIN" "${ARGS[@]}")
          echo "$REPORT"
          case "$REPORT" in *"valid depth 0/"*) echo "FAIL: 没有有效深度"; exit 1;; esac
          case "$REPORT" in *"timings ms:"*) ;; *) echo "FAIL: 没有耗时报告"; exit 1;; esac
          [ "$(head -c 2 build/cli-out/depth.pfm)" = "Pf" ] || { echo "FAIL: depth 不是 PFM"; exit 1; }
          [ "$(head -c 3 build/cli-out/cloud.ply)" = "ply" ] || { echo "FAIL: 点云不是 PLY"; exit 1; }
          # 确定性：同一输入跑两次，产物逐字节一致
          "$BIN" --left apps/cli/testdata/left.pgm \
                 --right apps/cli/testdata/right.pgm \
                 --calib apps/cli/testdata/calib.txt \
                 --depth build/cli-out/depth2.pfm \
                 --disp build/cli-out/disp2.pfm > /dev/null
          cmp build/cli-out/depth.pfm build/cli-out/depth2.pfm
          cmp build/cli-out/disp.pfm build/cli-out/disp2.pfm
          echo "OK: CLI 产物非空且确定"
