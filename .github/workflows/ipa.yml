name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, test]
    paths:
      - ".github/workflows/ipa.yml"
      - "StereoVision/**"
      - "core/**"
      - "Config/**"
      - "project.yml"
      # 校验脚本参与构建（scripts/check_xcodeproj_sources.sh），改了它必须重跑
      - "scripts/**"
      - "tools/check_api_surface.py"

# 工程文件**由 CI 从 project.yml 生成**（不依赖仓库里提交的 .xcodeproj）：
#   1) xcodegen generate --spec project.yml
#   2) bash scripts/check_xcodeproj_sources.sh   ← 漏文件会当场失败
# 本地改了 sources 不需要再手动改 pbxproj。

permissions:
  contents: read

jobs:
  build:
    # macOS arm64 的托管 runner 容量紧张，常常排不到；x64 镜像出的是同样的 arm64 iOS 二进制
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # 工程文件由 project.yml 生成，不再依赖仓库里提交的 .xcodeproj。
      # 本文件观察到的是 xcodegen 2.46.0；版本漂移只告警不阻断（pbxproj 每次都是全新的）。
      # 契约与边界检查：C API 表面快照 + 目录/依赖红线（与 core.yml 同一套脚本）
      - name: Contract checks (C API surface + layering)
        run: |
          set -euo pipefail
          PY=""
          for c in python3 python; do
            if "$c" -c "import sys" >/dev/null 2>&1; then PY="$c"; break; fi
          done
          [ -n "$PY" ] || { echo "找不到可用的 python"; exit 1; }
          echo "python: $PY ($("$PY" -V 2>&1))"
          "$PY" tools/check_api_surface.py
          bash scripts/check_layering.sh

      - name: Generate project from project.yml
        run: |
          set -euo pipefail
          brew install xcodegen || brew upgrade xcodegen || true
          echo "xcodegen: $(xcodegen --version)"
          case "$(xcodegen --version)" in
            *2.46.0*) ;;
            *) echo "::warning::xcodegen 版本与记录不同，构建产物可能有细微差异" ;;
          esac
          xcodegen generate --spec project.yml
          xcodebuild -list -project StereoVision.xcodeproj

      # 生成器只看 project.yml 的 sources：漏掉一个文件时 xcodebuild 仍然成功，
      # 只是那个文件不参与编译。这一步让它当场失败。
      - name: Verify every source file is in the generated project
        run: bash scripts/check_xcodeproj_sources.sh

      - name: Show toolchain
        run: |
          uname -m
          xcodebuild -version
          xcrun --find metal

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project StereoVision.xcodeproj \
            -scheme StereoVision \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            build > /tmp/build.log 2>&1 || { tail -80 /tmp/build.log; exit 1; }
          grep -E "BUILD SUCCEEDED|error:|warning:" /tmp/build.log | head -20 || true
          tail -5 /tmp/build.log

      # 桥接契约测试（模拟器）：跨语言 ABI 与 C++ golden 逐位一致 + 参数表自洽。
      # 没有它，Bridge 的指针/跨度/格式转换只能靠真机发现。
      - name: Bridge contract tests (iOS Simulator)
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | grep -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}")
          if [ -z "$UDID" ]; then
            xcrun simctl list devices available
            echo "找不到可用的 iPhone 模拟器"
            exit 1
          fi
          echo "simulator: $UDID"
          xcodebuild test \
            -project StereoVision.xcodeproj \
            -scheme StereoVision \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tail -60

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/StereoVision.app"
          test -d "$APP" || { echo "app not found"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"
          ls -la "$APP" | head -20
          rm -rf Payload && mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry StereoVision-unsigned.ipa Payload
          ls -lh StereoVision-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: StereoVision-unsigned-ipa
          path: StereoVision-unsigned.ipa
          if-no-files-found: error
