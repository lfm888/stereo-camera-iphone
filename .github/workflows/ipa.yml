name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, test]
    paths:
      - ".github/workflows/ipa.yml"
      - "StereoVision/**"
      - "core/**"
      - "Config/**"
      - "project.yml"

# 注意：三个流水线都**直接编译仓库里提交的** StereoVision.xcodeproj，不跑 xcodegen。
# 所以改了 project.yml 之后必须在本地 `xcodegen generate` 并工程文件一起提交，
# 否则 CI 用的是旧工程，新增的源码（例如 core/）根本不会被编译，而且不会报错。

permissions:
  contents: read

jobs:
  build:
    # macOS arm64 的托管 runner 容量紧张，常常排不到；x64 镜像出的是同样的 arm64 iOS 二进制
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          uname -m
          xcodebuild -version
          xcrun --find metal
          xcodebuild -project StereoVision.xcodeproj -list

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project StereoVision.xcodeproj \
            -scheme StereoVision \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            build > /tmp/build.log 2>&1 || { tail -80 /tmp/build.log; exit 1; }
          grep -E "BUILD SUCCEEDED|error:|warning:" /tmp/build.log | head -20 || true
          tail -5 /tmp/build.log

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/StereoVision.app"
          test -d "$APP" || { echo "app not found"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"
          ls -la "$APP" | head -20
          rm -rf Payload && mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry StereoVision-unsigned.ipa Payload
          ls -lh StereoVision-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: StereoVision-unsigned-ipa
          path: StereoVision-unsigned.ipa
          if-no-files-found: error
