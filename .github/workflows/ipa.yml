name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      with_yolo:
        description: "Bundle the YOLO11n-seg CoreML model (exported on Linux, ~6 min extra)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/ipa.yml"
      - "StereoVision/**"
      - "Config/**"
      - "project.yml"

permissions:
  contents: read

jobs:
  # Optional: convert YOLO11n-seg -> CoreML. Runs on Linux because the pinned
  # torch/torchvision wheels no longer exist for macOS x86_64.
  model:
    if: ${{ inputs.with_yolo }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export YOLO11n-seg to CoreML
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.5.1" "torchvision==0.20.1" "numpy<2" "coremltools==8.1" ultralytics
          yolo export model=yolo11n-seg.pt format=coreml imgsz=640 nms=False
          ls -la yolo11n-seg.mlpackage

      - uses: actions/upload-artifact@v4
        with:
          name: yolo-model
          path: yolo11n-seg.mlpackage
          if-no-files-found: error

  build:
    needs: [model]
    if: ${{ !cancelled() && needs.model.result != 'failure' }}
    # macOS *arm64* hosted runners (macos-15 / macos-26) are capacity constrained and often never
    # get assigned; the x64 image (macos-15-intel) is not, and produces the same arm64 iOS binary.
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          uname -m
          xcodebuild -version
          xcrun --find metal
          xcodebuild -project StereoVision.xcodeproj -list

      - name: Fetch YOLO model
        if: needs.model.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: yolo-model
          path: StereoVision/Models

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project StereoVision.xcodeproj \
            -scheme StereoVision \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tail -60

      - name: Package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/StereoVision.app"
          test -d "$APP" || { echo "app not found"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"
          ls -la "$APP" | head -20
          rm -rf Payload && mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry StereoVision-unsigned.ipa Payload
          ls -lh StereoVision-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: StereoVision-unsigned-ipa
          path: StereoVision-unsigned.ipa
          if-no-files-found: error
