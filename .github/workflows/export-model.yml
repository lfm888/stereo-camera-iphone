name: Build IPA with a freshly exported model

# pth -> CoreML -> 未签名 IPA，全程在 Actions 里做，不往仓库回写任何模型文件。
#
# 为什么导出要放在这里而不是 Windows：Windows 的 coremltools 缺原生库
# （libmilstoragepython / libmodelpackage），只能存旧的 neural network 格式（float32 的 .mlmodel），
# 它在 iPhone 上只能吃 CPU。Linux 的 coremltools wheel 带原生库，能存 mlprogram（float16 的 .mlpackage，
# iOS17+），Core ML 才会把它调度到 Metal / 神经引擎上。
#
#   export (ubuntu)          装 torch + coremltools + segzoo（只为重建网络结构），跑 scripts/export_lens_seg.py 写 mlpackage
#   ipa    (macos-15-intel)  把 mlpackage 放进 StereoVision/Models/，xcodebuild 出未签名 IPA 并上传 artifact

on:
  push:
    branches: [main]
    paths:
      - "models/**"
      - "scripts/export_lens_seg.py"
      - ".github/workflows/export-model.yml"
  workflow_dispatch:
    inputs:
      ckpt:
        description: "仓库里的 checkpoint 路径"
        default: "models/lens-seg.pth"

permissions:
  contents: read

env:
  SEGZOO_REPO: https://github.com/lfm888/segzoo.git
  # 固定 segzoo 的 commit：只用来重建网络结构，保证以后重跑导出得到同一个模型
  SEGZOO_REF: 980943b0f0756a88f55ab0b2df7443d58925db75
  MLPACKAGE: StereoVision/Models/lens-seg.mlpackage

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.2.2" "torchvision==0.17.2"
          pip install "numpy<2" "coremltools==9.0" pillow "opencv-python-headless" \
                      "segmentation-models-pytorch==0.3.4" "timm==0.9.7" "huggingface_hub<0.26" \
                      ml_collections scipy
          python -c "import coremltools.libmilstoragepython as b; print('native blob writer OK')"

      - name: Checkout segzoo (model definition lives there)
        run: |
          git clone --filter=blob:none "$SEGZOO_REPO" /tmp/segzoo
          git -C /tmp/segzoo checkout "$SEGZOO_REF"
          git -C /tmp/segzoo log --oneline -1

      - name: Export pth -> mlpackage (mlprogram, float16)
        run: |
          CKPT="${{ inputs.ckpt || 'models/lens-seg.pth' }}"
          test -f "$CKPT" || { echo "checkpoint not found: $CKPT"; exit 1; }
          python scripts/export_lens_seg.py \
            --ckpt "$CKPT" --segzoo /tmp/segzoo \
            --out "${MLPACKAGE%.mlpackage}" --format mlpackage
          du -sh "$MLPACKAGE"
          find "$MLPACKAGE" -maxdepth 1

      - uses: actions/upload-artifact@v4
        with:
          name: lens-seg-mlpackage
          path: StereoVision/Models/lens-seg.mlpackage
          if-no-files-found: error

  ipa:
    needs: export
    # macOS arm64 的托管 runner 容量紧张，常常排不到；x64 镜像出的是同样的 arm64 iOS 二进制
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          uname -m
          xcodebuild -version
          xcrun --find coremlcompiler

      # 单个目录做 artifact 时里面存的是目录内容（manifest.plist / data/...），所以解到 build/pkg
      - uses: actions/download-artifact@v4
        with:
          name: lens-seg-mlpackage
          path: build/pkg

      - name: Put the model where the Xcode preBuild script finds it
        run: |
          ls -la build/pkg
          SRC=build/pkg
          [ -d build/pkg/lens-seg.mlpackage ] && SRC=build/pkg/lens-seg.mlpackage
          # coremltools 9 写的是 Manifest.json + Data/（新版格式），旧格式是 manifest.plist
          { [ -f "$SRC/Manifest.json" ] || [ -f "$SRC/manifest.plist" ]; } || { echo "$SRC is not an mlpackage"; ls -la "$SRC"; exit 1; }
          mkdir -p StereoVision/Models
          rm -rf "$MLPACKAGE"
          mkdir -p "$MLPACKAGE"
          cp -R "$SRC"/. "$MLPACKAGE"/
          # 仓库里那个 Windows 导出的 float32 .mlmodel 留着不影响（preBuild 优先编译 mlpackage），
          # 但为了不混淆，这里删掉，只编译本次导出的 mlpackage
          rm -f StereoVision/Models/lens-seg.mlmodel
          du -sh StereoVision/Models/*

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project StereoVision.xcodeproj \
            -scheme StereoVision \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            build > /tmp/build.log 2>&1 || { tail -80 /tmp/build.log; exit 1; }
          grep -E "coremlcompiler|lens-seg|BUILD SUCCEEDED|error:" /tmp/build.log | head -20 || true
          tail -5 /tmp/build.log

      - name: Package unsigned IPA
        run: |
          APP="build/dd/Build/Products/Release-iphoneos/StereoVision.app"
          test -d "$APP" || { echo "app not found"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          find "$APP" -maxdepth 1 -name "*.mlmodelc" -exec du -sh {} \;
          rm -rf Payload && mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry StereoVision-unsigned.ipa Payload
          ls -lh StereoVision-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: StereoVision-unsigned-ipa
          path: StereoVision-unsigned.ipa
          if-no-files-found: error
