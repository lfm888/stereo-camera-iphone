name: Export lens-seg CoreML model

# pth -> CoreML 的导出在这里做，不在 Windows 上做：
#   Windows 的 coremltools 缺原生库（libmilstoragepython / libmodelpackage），只能存旧的
#   neural network 格式（float32 的 .mlmodel），它上不了 SoC 的 GPU / ANE。
#   Linux 的 wheel 带原生库，能存 mlprogram（float16 的 .mlpackage，iOS17+），这才走得到 Metal / ANE。
#
# 两步：
#   export (ubuntu)  装 torch + coremltools + segzoo（只为重建网络结构），跑 scripts/export_lens_seg.py 写 mlpackage
#   commit (ubuntu)  把 mlpackage 提交回 main、删掉旧的 float32 .mlmodel；提交后 ipa.yml 自动出安装包
#                    （bot 的推送不触发普通 push 事件，所以 ipa.yml 里挂了 workflow_run）
#
# 想在本机复核数值（可选，需要 macOS）：scripts/verify_lens_seg.py 的 dump / check，见 models/README.md。

on:
  push:
    branches: [main]
    paths:
      - "models/**"
      - "scripts/export_lens_seg.py"
      - ".github/workflows/export-model.yml"
  workflow_dispatch:
    inputs:
      ckpt:
        description: "仓库里的 checkpoint 路径"
        default: "models/lens-seg.pth"
      commit:
        description: "导出后把 mlpackage 提交回 main（并触发 IPA 构建）"
        type: boolean
        default: true

permissions:
  contents: write

env:
  SEGZOO_REPO: https://github.com/lfm888/segzoo.git
  # 固定 segzoo 的 commit：只用来重建网络结构，保证以后重跑导出得到同一个模型
  SEGZOO_REF: 980943b0f0756a88f55ab0b2df7443d58925db75
  MLPACKAGE: StereoVision/Models/lens-seg.mlpackage

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.2.2" "torchvision==0.17.2"
          pip install "numpy<2" "coremltools==9.0" pillow "opencv-python-headless" \
                      "segmentation-models-pytorch==0.3.4" "timm==0.9.7" "huggingface_hub<0.26" \
                      ml_collections scipy
          python -c "import coremltools.libmilstoragepython as b; print('native blob writer OK')"

      - name: Checkout segzoo (model definition lives there)
        run: |
          git clone --filter=blob:none "$SEGZOO_REPO" /tmp/segzoo
          git -C /tmp/segzoo checkout "$SEGZOO_REF"
          git -C /tmp/segzoo log --oneline -1

      - name: Export pth -> mlpackage (mlprogram, float16)
        run: |
          CKPT="${{ inputs.ckpt || 'models/lens-seg.pth' }}"
          test -f "$CKPT" || { echo "checkpoint not found: $CKPT"; exit 1; }
          python scripts/export_lens_seg.py \
            --ckpt "$CKPT" --segzoo /tmp/segzoo \
            --out "${MLPACKAGE%.mlpackage}" --format mlpackage
          du -sh "$MLPACKAGE"
          find "$MLPACKAGE" -maxdepth 1

      - uses: actions/upload-artifact@v4
        with:
          name: lens-seg-mlpackage
          path: StereoVision/Models/lens-seg.mlpackage
          if-no-files-found: error

  commit:
    needs: export
    if: ${{ github.event_name == 'push' || inputs.commit }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 单个目录做 artifact 时，里面存的是目录内容（manifest.plist / data/...），所以解到 build/pkg
      - uses: actions/download-artifact@v4
        with:
          name: lens-seg-mlpackage
          path: build/pkg

      - name: Replace the model in StereoVision/Models
        run: |
          ls -la build/pkg
          SRC=build/pkg
          [ -d build/pkg/lens-seg.mlpackage ] && SRC=build/pkg/lens-seg.mlpackage
          test -f "$SRC/manifest.plist" || { echo "$SRC 不是 mlpackage（没有 manifest.plist）"; exit 1; }
          rm -rf "$MLPACKAGE"
          mkdir -p "$MLPACKAGE"
          cp -R "$SRC"/. "$MLPACKAGE"/
          # 旧的 float32 neural network 模型（Windows 导出的）不再需要：编译产物同名会打架
          git rm -q --ignore-unmatch StereoVision/Models/lens-seg.mlmodel || true
          rm -f StereoVision/Models/lens-seg.mlmodel
          du -sh StereoVision/Models/*

      - name: Commit and push
        run: |
          CKPT="${{ inputs.ckpt || 'models/lens-seg.pth' }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A StereoVision/Models
          if git diff --cached --quiet; then
            echo "模型没有变化，不提交"
            exit 0
          fi
          git commit -m "model: lens-seg 换成 CI 导出的 mlprogram（float16，GPU/ANE），源 $(basename "$CKPT") $(sha256sum "$CKPT" | cut -c1-12)"
          git push
