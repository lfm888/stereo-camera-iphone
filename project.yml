name: StereoVision
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"

targets:
  # 只有**一个** target：C++ 核心的源码直接编进 app。
  #
  # 为什么不拆成独立的静态库 target：iOS 侧没有收益（产物最终都进 .app），
  # 而拆开会让 pbxproj 与实际编译方式不一致（曾经 project.yml 里写了
  # `type: static-library` 这种 XcodeGen 不认的写法，导致 spec 从来没生效过）。
  # 跨平台复用靠的是同一份源码 + core/CMakeLists.txt，与 Xcode target 结构无关。
  #
  # 注意：改了 sources 之后不需要手动动 pbxproj —— CI 每次都从本文件生成工程。
  StereoVision:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: StereoVision
      # C++ 核心（第一层）。直接编进 app target。
      - path: core/src
      # 头文件只作为工程里的引用，不参与编译（C/C++ 源文件用 HEADER_SEARCH_PATHS 找）
      - path: core/include
        buildPhase: none
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # 第二层：Swift 只看桥接头，桥接头里不出现 C++ 头
        SWIFT_OBJC_BRIDGING_HEADER: StereoVision/StereoVision-Bridging-Header.h
        # Bridge/*.mm 要 include "stereo/stereo_c_api.h"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/core/include"
        CLANG_CXX_LANGUAGE_STANDARD: gnu++20
        CLANG_CXX_LIBRARY: libc++
        INFOPLIST_KEY_CFBundleDisplayName: StereoVision
        INFOPLIST_KEY_NSCameraUsageDescription: "StereoVision uses the wide and ultra-wide cameras to compute stereo depth."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "StereoVision saves photos and videos of the stereo view to your library."
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        MTL_FAST_MATH: YES

  # ---------------------------------------------------------------------------
  # iOS 侧唯一的自动化测试：只测**桥接契约**（不测算法，不跑相机）。
  #
  #   1) 跨语言 ABI：core/tests/golden 的 tiny 向量经 SVStereoCore 跑一遍，
  #      与 C++ golden 的 disp_f32 逐位一致；
  #   2) 参数表自洽（UI 控件与默认值都来自它）；
  #   3) 无状态函数（sampleDepth）不需要 context。
  #
  # 夹具直接引用 core/tests/golden 里的 .npy（不复制、不改 C++ 测试的仓库布局）。
  # ---------------------------------------------------------------------------
  StereoVisionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StereoVisionTests
      - path: core/tests/golden/left_u8.npy
        buildPhase: resources
      - path: core/tests/golden/right_u8.npy
        buildPhase: resources
      - path: core/tests/golden/disp_f32.npy
        buildPhase: resources
    dependencies:
      - target: StereoVision
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        # 单元测试宿主：测试 bundle 要注入 App 进程，才能看见 Bridging Header 导入的类型
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StereoVision.app/StereoVision"
        BUNDLE_LOADER: "$(TEST_HOST)"

# 显式 scheme：原来由 Xcode 自动生成；加了 test target 之后需要声明它属于哪个 scheme，
# CI 才能用 `xcodebuild test -scheme StereoVision` 跑模拟器测试。
schemes:
  StereoVision:
    build:
      targets:
        StereoVision: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StereoVisionTests
